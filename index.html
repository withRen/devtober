<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Devtober 2026</title>
  <meta name="description" content="1 mot par jour pendant tout octobre, 1 création en code.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c0b10;
      --surface: #16151c;
      --border: #26242f;
      --text: #ece9f2;
      --muted: #7d7989;
      --accent: #ff6b3d;
      --accent-soft: rgba(255, 107, 61, .12);
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Space Grotesk", system-ui, sans-serif;
      padding: clamp(24px, 6vw, 72px) 16px;
    }
    main { max-width: 1040px; margin: 0 auto; }

    header { margin-bottom: 48px; }
    .eyebrow {
      font-family: "JetBrains Mono", monospace;
      font-size: 13px;
      color: var(--accent);
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    h1 {
      font-size: clamp(44px, 9vw, 96px);
      font-weight: 700;
      letter-spacing: -.04em;
      line-height: .95;
      margin: 12px 0 20px;
    }
    .lead { font-size: 18px; color: var(--muted); max-width: 520px; line-height: 1.5; }
    .lead strong { color: var(--text); font-weight: 500; }

    .stats {
      display: flex; gap: 24px; flex-wrap: wrap;
      margin-top: 28px;
      font-family: "JetBrains Mono", monospace; font-size: 13px; color: var(--muted);
    }
    .stats b { color: var(--text); font-weight: 500; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
    }
    .day {
      position: relative;
      display: flex; flex-direction: column; justify-content: space-between;
      aspect-ratio: 1;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      color: var(--muted);
      text-decoration: none;
      transition: transform .15s, border-color .15s, background .15s;
    }
    .num { font-family: "JetBrains Mono", monospace; font-size: 13px; }
    .word { font-size: 22px; font-weight: 500; letter-spacing: -.02em; }
    .tag {
      position: absolute; top: 14px; right: 14px;
      font-family: "JetBrains Mono", monospace; font-size: 11px;
      padding: 3px 8px; border-radius: 99px;
    }

    .day.done { color: var(--text); border-color: #3a3746; }
    .day.done .tag { background: var(--accent-soft); color: var(--accent); }
    .day.done:hover { transform: translateY(-3px); border-color: var(--accent); background: #1c1a23; }

    .day.today { border-color: var(--accent); color: var(--text); }
    .day.today .tag { background: var(--accent); color: var(--bg); }

    .day.future { opacity: .45; }

    footer {
      margin-top: 56px; padding-top: 24px;
      border-top: 1px solid var(--border);
      font-size: 14px; color: var(--muted);
      display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px;
    }
    footer a { color: var(--text); }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">#devtober · octobre 2026</p>
      <h1>Devtober</h1>
      <p class="lead"><strong>1 mot par jour, 1 création en code.</strong> Jeu, animation, art génératif, outil… la forme est libre.</p>
      <div class="stats" id="stats"></div>
    </header>

    <section class="grid" id="grid"></section>

    <footer>
      <span>Les autres participants : <a href="https://github.com/topics/devtober">github.com/topics/devtober</a></span>
      <a href="https://github.com/withRen/devtober">Code source</a>
    </footer>
  </main>

  <script>
    const WORDS = [
      "Pulse", "Loop", "Bloom", "Drift", "Chaos", "Tiny", "Swarm", "Maze",
      "Gravity", "Fold", "Ripple", "Lost", "Tangle", "Bounce", "Shadow", "Tide",
      "Orbit", "Glitch", "Echo", "Fragile", "Signal", "Mirror", "Spark", "Hidden",
      "Melt", "Machine", "Haunted", "Grow", "Infinite", "Collapse", "Wake"
    ];

    // Numéros des jours publiés (dossier day-XX-mot présent)
    const DONE = [1];

    const now = new Date();
    const today = now.getFullYear() === 2026 && now.getMonth() === 9 ? now.getDate() : 0;
    const slug = (i, w) => `day-${String(i).padStart(2, "0")}-${w.toLowerCase()}`;

    document.getElementById("grid").innerHTML = WORDS.map((w, idx) => {
      const i = idx + 1;
      const num = `<span class="num">${String(i).padStart(2, "0")}</span>`;
      const word = `<span class="word">${w}</span>`;
      if (DONE.includes(i)) {
        return `<a class="day done" href="${slug(i, w)}/">${num}<span class="tag">voir →</span>${word}</a>`;
      }
      if (i === today) {
        return `<div class="day today">${num}<span class="tag">aujourd'hui</span>${word}</div>`;
      }
      return `<div class="day ${i > today ? "future" : ""}">${num}${word}</div>`;
    }).join("");

    document.getElementById("stats").innerHTML =
      `<span><b>${DONE.length}</b> / 31 publiés</span>` +
      (today ? `<span>Jour <b>${today}</b> : ${WORDS[today - 1]}</span>` : "");
  </script>
</body>
</html>
