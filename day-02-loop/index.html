<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loop, jour 02 | Devtober 2026</title>
  <meta name="description" content="Un générateur de fonds d'écran : des milliers de particules en boucle, en points, en ASCII ou en vecteurs.">
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <style>
    /* Arrondis : pilule (999px) pour les boutons, puces et notifications ;
       12px pour les surfaces (nœuds, menus, cartes) ; 6px pour les petits contrôles
       à l'intérieur (champs, listes, touches, miniatures) ; cercles pour les prises et pastilles. */
    :root {
      color-scheme: dark;
      --bg: #0b0b0c;
      --panel: #111113;
      --raise: #19191c;
      --line: #26262a;
      --line-strong: #38383e;
      --text: #ededee;
      --muted: #a1a1a8;
      --faint: #85858c;
      --accent: #eb0a1e;
      --ease: cubic-bezier(.16, 1, .3, 1);
      --panel-w: 340px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { height: 100dvh; }
    body {
      background: var(--bg); color: var(--text);
      font-family: "Geist", system-ui, sans-serif; font-size: 14px;
      -webkit-font-smoothing: antialiased;
      display: grid; grid-template-rows: 56px 1fr; overflow: hidden;
    }
    .mono { font-family: "Geist Mono", ui-monospace, monospace; }
    button { font: inherit; color: inherit; }

    /* ---------- Barre du haut ---------- */
    .top { display: flex; align-items: center; gap: 16px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
    .back { color: var(--muted); text-decoration: none; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; transition: color .3s var(--ease); }
    .back:hover { color: var(--text); }
    .title { font-weight: 600; letter-spacing: -.01em; }
    .title span { color: var(--faint); font-weight: 400; margin-left: 6px; }
    .spacer { flex: 1; }
    .actions { display: flex; gap: 6px; align-items: center; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      height: 34px; padding: 0 12px;
      border: 1px solid var(--line-strong); border-radius: 999px;
      background: var(--raise); color: var(--text);
      font-size: 13px; font-weight: 500; white-space: nowrap; cursor: pointer;
      transition: border-color .3s var(--ease), background .3s var(--ease), transform .15s var(--ease);
    }
    .btn:hover { border-color: #55555c; }
    .btn:active { transform: scale(.97); }
    .btn:disabled { opacity: .5; cursor: progress; }
    .btn i { font-size: 16px; }
    .btn.icon { width: 34px; padding: 0; }
    .btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
    .btn.primary:hover { background: #fff; }
    .btn.wide { width: 100%; height: 38px; }

    /* ---------- Zone de travail ---------- */
    .work { display: grid; grid-template-columns: 1fr var(--panel-w); min-height: 0; transition: grid-template-columns .3s var(--ease); }
    body.panel-hidden .work { grid-template-columns: 1fr 0; }
    body.panel-hidden .panel { visibility: hidden; }

    .stage-wrap { --ne-h: 42vh; display: grid; grid-template-rows: minmax(160px, 1fr) auto auto; min-width: 0; min-height: 0; }
    #toggle-nodes[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }

    /* ---------- Éditeur de nœuds ---------- */
    .nodes { position: relative; height: var(--ne-h); min-height: 180px; display: grid; grid-template-rows: auto 1fr; border-top: 1px solid var(--line); background: #0d0d0f; }
    .ne-resize { position: absolute; top: -4px; left: 0; right: 0; height: 8px; cursor: ns-resize; z-index: 3; }
    .ne-bar { display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel); overflow-x: auto; }
    .ne-title { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; margin-right: 8px; white-space: nowrap; }
    .ne-hint { margin-left: 8px; font-size: 12px; color: var(--faint); white-space: nowrap; }
    .ne-view {
      position: relative; overflow: hidden; cursor: grab; touch-action: none;
      background-image: radial-gradient(circle, #ffffff12 1px, transparent 1.3px);
    }
    .ne-view:active { cursor: grabbing; }
    .ne-world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
    .ne-wires { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
    .ne-wires path { fill: none; }
    .w-flow path { stroke: #3a3a40; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }
    .w-links .wire { stroke: #c9c9cf; stroke-width: 2.4; }
    .w-links .wire.to-pipe { stroke: var(--accent); }
    .w-links .hit { stroke: transparent; stroke-width: 14; pointer-events: stroke; cursor: pointer; }
    .w-links .hit:hover + .wire { stroke: #fff; stroke-width: 3.4; }
    .w-temp { stroke: #fff; stroke-width: 2.4; stroke-dasharray: 6 5; }
    .ne-layer { position: absolute; left: 0; top: 0; }
    .ne-empty { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); font-size: 13px; color: var(--muted); background: var(--raise); border: 1px solid var(--line-strong); border-radius: 999px; padding: 8px 14px; pointer-events: none; white-space: nowrap; }

    .node {
      position: absolute; width: 220px; border-radius: 12px;
      background: #1c1c20; border: 1px solid #2e2e34;
      box-shadow: 0 12px 30px -12px rgb(5 5 6 / .9); cursor: default; font-size: 12px;
    }
    .node.sel { border-color: #e6e6e9; }
    .node header {
      position: relative; display: flex; align-items: center; gap: 7px;
      height: 30px; padding: 0 10px; border-radius: 11px 11px 0 0;
      font-weight: 600; font-size: 12.5px; cursor: grab;
      background: #26262b; border-bottom: 1px solid #2e2e34;
    }
    .node.pipe header { background: #2b2b31; }
    .node.cat-entree header, .node.cat-outil header { background: #26262b; }
    .node.cat-entree header { box-shadow: inset 3px 0 0 #e6e6e9; }
    .node.cat-outil header { box-shadow: inset 3px 0 0 #6e6e76; }
    .node header i { font-size: 14px; color: var(--muted); }
    .nx { margin-left: auto; display: grid; place-items: center; width: 20px; height: 20px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); cursor: pointer; }
    .nx:hover { background: #ffffff18; color: var(--text); }
    .flow { position: absolute; top: 50%; width: 10px; height: 10px; margin-top: -5px; border-radius: 50%; background: #55555c; border: 2px solid #1c1c20; }
    .flow.fin { left: -6px; }
    .flow.fout { right: -6px; }
    .node .rows { padding: 6px 0 8px; display: grid; gap: 3px; }
    .node .row { position: relative; display: flex; align-items: center; gap: 6px; padding: 0 10px; min-height: 24px; }
    .node .row.out { justify-content: flex-end; gap: 8px; color: var(--muted); }
    .node .row.out output { font-family: "Geist Mono", monospace; font-size: 11px; color: var(--text); min-width: 46px; text-align: right; }
    .node .row.note { color: var(--faint); font-size: 11px; justify-content: center; }
    .sock { position: absolute; top: 50%; width: 12px; height: 12px; margin-top: -6px; border-radius: 50%; background: #8a8a92; border: 2px solid #1c1c20; cursor: crosshair; z-index: 1; }
    .sock.in { left: -7px; }
    .sock.out { right: -7px; background: #d8d8dc; }
    .sock.in.on { background: var(--accent); }
    .sock:hover { transform: scale(1.3); }
    .sock-gap { display: none; }
    .lock { position: absolute; left: -7px; font-size: 11px; color: #7f7f87; background: #1c1c20; border-radius: 50%; }

    .field {
      position: relative; flex: 1; height: 22px; border-radius: 6px; overflow: hidden;
      background: #2a2a30; cursor: ew-resize; display: flex; align-items: center; justify-content: space-between; padding: 0 8px;
      user-select: none;
    }
    .field:hover { background: #313138; }
    .f-fill { position: absolute; inset: 0; background: #4a4a54; transform-origin: left; pointer-events: none; }
    .f-label, .f-val { position: relative; white-space: nowrap; }
    .f-label { color: #c9c9cf; overflow: hidden; text-overflow: ellipsis; margin-right: 6px; }
    .f-val { font-family: "Geist Mono", monospace; font-size: 11px; color: #fff; }
    .field.driven { cursor: default; }
    .field.driven .f-fill { background: color-mix(in srgb, var(--accent) 55%, #2a2a30); }
    .f-input { position: absolute; inset: 0; width: 100%; border: 1px solid #fff; border-radius: 6px; background: #111; color: #fff; font: 500 12px "Geist Mono", monospace; padding: 0 8px; }
    .node .sel, .node .col, .node .tog { flex: 1; display: flex; justify-content: space-between; align-items: center; gap: 8px; color: #c9c9cf; }
    .node select { flex: 1; max-width: 120px; height: 22px; border-radius: 6px; border: 1px solid #38383e; background: #2a2a30; color: #fff; font: 12px "Geist", sans-serif; padding: 0 4px; }
    .node input[type=color] { width: 40px; height: 20px; border: 1px solid #38383e; border-radius: 6px; background: none; padding: 1px; }
    .viewer { display: block; width: calc(100% - 20px); margin: 4px 10px; border-radius: 6px; background: #0a0a0b; }

    .ne-menu { position: absolute; z-index: 5; width: 190px; padding: 6px; border-radius: 12px; background: #1c1c20; border: 1px solid #38383e; box-shadow: 0 20px 40px -10px rgb(5 5 6 / .9); }
    .ne-menu p { padding: 6px 8px 4px; font-size: 11px; color: var(--faint); }
    .ne-menu button { display: flex; align-items: center; gap: 8px; width: 100%; height: 30px; padding: 0 8px; border: 0; border-radius: 6px; background: transparent; color: var(--text); font-size: 13px; cursor: pointer; text-align: left; }
    .ne-menu button:hover { background: #2e2e34; }
    #stage {
      position: relative; display: grid; place-items: center; min-height: 0; overflow: hidden;
      background-image: radial-gradient(circle, #ffffff0c 1px, transparent 1.2px);
      background-size: 18px 18px;
    }
    #view, #draw { grid-area: 1 / 1; display: block; box-shadow: 0 0 0 1px var(--line), 0 30px 80px -30px rgb(5 5 6 / .95); }
    #draw { position: relative; z-index: 1; box-shadow: none; pointer-events: none; cursor: crosshair; }
    #stage.drawing #draw { pointer-events: auto; }
    #stage.drawing #view { opacity: .35; }

    .stage-meta { position: absolute; top: 12px; left: 14px; right: 14px; display: flex; justify-content: space-between; font-size: 12px; color: var(--faint); pointer-events: none; }
    #paused-badge {
      position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
      display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px;
      background: var(--raise); border: 1px solid var(--line-strong); font-size: 12px; color: var(--muted); pointer-events: none;
    }
    .btn.busy { position: relative; overflow: hidden; }
    .btn.busy::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgb(11 11 12 / .25) 50%, transparent 70%); background-size: 220% 100%; animation: shimmer 1s linear infinite; }
    #draw-hint {
      position: absolute; top: 46px; left: 50%; transform: translateX(-50%);
      padding: 8px 14px; border-radius: 999px; background: var(--raise); border: 1px solid var(--line-strong);
      font-size: 13px; color: var(--text); pointer-events: none;
    }

    .bottom { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-top: 1px solid var(--line); background: var(--panel); overflow-x: auto; }
    .bottom .label { font-size: 12px; color: var(--faint); white-space: nowrap; }

    /* ---------- Panneau ---------- */
    .panel { border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; min-height: 0; overscroll-behavior: contain; }
    .panel-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
    .sec { padding: 16px; border-bottom: 1px solid var(--line); display: grid; gap: 14px; }
    .sec { animation: rise .5s cubic-bezier(.16, 1, .3, 1) both; animation-delay: calc(var(--i, 0) * 45ms); }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
    .sec h2 { font-size: 13px; font-weight: 600; letter-spacing: .01em; }
    .sec-toggle { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 0; border: 0; background: none; color: var(--text); cursor: pointer; text-align: left; }
    .sec-toggle i { color: var(--faint); font-size: 14px; transition: transform .3s cubic-bezier(.16, 1, .3, 1); }
    .sec.closed .sec-toggle i { transform: rotate(-90deg); }
    .sec.closed > .ctl { display: none; }
    .sec.closed { gap: 0; }
    .ctl { display: grid; gap: 6px; }
    .ctl[hidden] { display: none; }
    .ctl-head { display: flex; justify-content: space-between; align-items: baseline; color: var(--muted); font-size: 13px; }
    .ctl-head output { font-family: "Geist Mono", monospace; font-size: 12px; color: var(--text); font-variant-numeric: tabular-nums; }

    input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; cursor: pointer; }
    input[type=range]::-webkit-slider-runnable-track { height: 3px; border-radius: 3px; background: linear-gradient(to right, var(--text) var(--p, 50%), var(--line-strong) var(--p, 50%)); }
    input[type=range]::-moz-range-track { height: 3px; background: var(--line-strong); border-radius: 3px; }
    input[type=range]::-moz-range-progress { height: 3px; background: var(--text); border-radius: 3px; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5.5px; border-radius: 50%; background: var(--text); border: 2px solid var(--panel); }
    input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--text); border: 2px solid var(--panel); }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      height: 30px; padding: 0 11px; border-radius: 999px;
      border: 1px solid var(--line-strong); background: transparent; color: var(--muted);
      font-size: 12.5px; cursor: pointer; white-space: nowrap;
      transition: border-color .25s var(--ease), color .25s var(--ease), background .25s var(--ease);
    }
    .chip:hover { color: var(--text); border-color: #55555c; }
    .chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }

    .presets { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .preset {
      display: grid; gap: 6px; padding: 6px 6px 8px; border-radius: 12px;
      border: 1px solid var(--line-strong); background: transparent; color: var(--muted);
      font-size: 12.5px; text-align: left; cursor: pointer;
      transition: border-color .25s var(--ease), color .25s var(--ease);
    }
    .preset span:last-child { padding: 0 4px; }
    .preset:hover { border-color: #55555c; color: var(--text); }
    .preset[aria-pressed="true"] { border-color: var(--text); color: var(--text); }
    .thumb { position: relative; display: block; aspect-ratio: 1; border-radius: 6px; overflow: hidden; background: #0a0a0b; }
    .thumb:has(img:not([src]))::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(100deg, transparent 30%, #ffffff10 50%, transparent 70%);
      background-size: 220% 100%; animation: shimmer 1.3s linear infinite;
    }
    @keyframes shimmer { from { background-position: 120% 0; } to { background-position: -120% 0; } }
    .preset:active, .chip:active, .sw:active { transform: scale(.97); }
    .thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .thumb img:not([src]) { visibility: hidden; }
    .swatches { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .sw {
      aspect-ratio: 1; border-radius: 50%; cursor: pointer;
      border: 2px solid transparent;
      background: radial-gradient(circle at 50% 50%, var(--c) 0 22%, var(--b) 23% 48%, var(--a) 49%);
      box-shadow: inset 0 0 0 1px #ffffff22;
      transition: transform .2s var(--ease);
    }
    .sw:hover { transform: scale(1.08); }
    .sw[aria-pressed="true"] { border-color: var(--text); }

    .color { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 13px; cursor: pointer; }
    .color input { width: 44px; height: 26px; border: 1px solid var(--line-strong); border-radius: 6px; background: none; padding: 2px; cursor: pointer; }
    .color input::-webkit-color-swatch-wrapper { padding: 0; }
    .color input::-webkit-color-swatch { border: 0; border-radius: 6px; }

    .toggle { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 13px; cursor: pointer; }
    .toggle input { position: absolute; opacity: 0; }
    .toggle i { width: 34px; height: 20px; border-radius: 999px; background: var(--line-strong); position: relative; transition: background .25s var(--ease); }
    .toggle i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--text); transition: transform .25s var(--ease); }
    .toggle input:checked + i { background: var(--text); }
    .toggle input:checked + i::after { transform: translateX(14px); background: var(--bg); }
    .toggle input:focus-visible + i { outline: 2px solid var(--accent); outline-offset: 2px; }

    .keys { padding: 16px; font-size: 12px; color: var(--faint); display: grid; gap: 6px; }
    kbd { font-family: "Geist Mono", monospace; font-size: 11px; padding: 1px 6px; border-radius: 6px; border: 1px solid var(--line-strong); color: var(--muted); }

    #toast {
      position: fixed; left: 50%; bottom: 70px; transform: translate(-50%, 10px);
      padding: 10px 16px; border-radius: 999px; background: var(--text); color: var(--bg);
      font-size: 13px; font-weight: 500; opacity: 0; pointer-events: none;
      transition: opacity .3s var(--ease), transform .3s var(--ease);
    }
    #toast.on { opacity: 1; transform: translate(-50%, 0); }

    [hidden] { display: none !important; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ---------- Mobile : le panneau passe sous l'aperçu ---------- */
    @media (max-width: 820px) {
      body { grid-template-rows: 56px auto; overflow: auto; }
      .work { grid-template-columns: 1fr; }
      .stage-wrap { height: 62vh; }
      .panel { border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
      .title span, .actions .hide-sm { display: none; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
  </style>
</head>
<body>
  <header class="top">
    <a class="back" href="../"><i class="ph ph-arrow-left"></i>Devtober</a>
    <span class="title">Loop<span>jour 02, générateur de fonds d'écran</span></span>
    <span class="spacer"></span>
    <div class="actions">
      <button class="btn" id="random" type="button" aria-label="Combinaison aléatoire"><i class="ph ph-shuffle"></i><span class="hide-sm">Aléatoire</span></button>
      <button class="btn" id="toggle-nodes" type="button" aria-pressed="false" aria-label="Éditeur de nœuds"><i class="ph ph-tree-structure"></i><span class="hide-sm">Nœuds</span></button>
      <button class="btn icon" id="pause" type="button" aria-label="Pause"><i class="ph-fill ph-pause"></i></button>
      <button class="btn icon hide-sm" id="toggle-panel" type="button" aria-label="Afficher ou masquer les réglages"><i class="ph ph-sidebar-simple"></i></button>
      <button class="btn hide-sm" id="export-svg" type="button"><i class="ph ph-bezier-curve"></i>SVG</button>
      <button class="btn primary" id="export-png" type="button"><i class="ph ph-download-simple"></i><span>PNG</span></button>
    </div>
  </header>

  <div class="work">
    <div class="stage-wrap">
      <div id="stage">
        <canvas id="view" aria-label="Aperçu du fond d'écran"></canvas>
        <canvas id="draw" aria-label="Zone de dessin"></canvas>
        <div class="stage-meta mono"><span id="frame-size"></span><span id="perf"></span></div>
        <p id="paused-badge" hidden><i class="ph-fill ph-pause"></i>En pause, <kbd>Espace</kbd> pour reprendre</p>
        <p id="draw-hint" hidden>Dessine une boucle d'un seul trait, relâche pour valider. <kbd>Échap</kbd> pour annuler.</p>
      </div>
      <section id="nodes" class="nodes" hidden aria-label="Éditeur de nœuds"></section>
      <div class="bottom">
        <span class="label">Format</span>
        <div class="chips" id="formats" style="flex-wrap: nowrap"></div>
      </div>
    </div>

    <aside class="panel" aria-label="Réglages">
      <div class="panel-actions">
        <button class="btn" id="share" type="button"><i class="ph ph-link"></i>Copier le lien</button>
        <button class="btn" id="reset" type="button"><i class="ph ph-arrow-counter-clockwise"></i>Par défaut</button>
      </div>
      <div id="controls"></div>
      <div class="keys">
        <span><kbd>Espace</kbd> pause</span>
        <span><kbd>R</kbd> combinaison aléatoire</span>
        <span><kbd>H</kbd> masquer les réglages</span>
        <span><kbd>N</kbd> éditeur de nœuds</span>
      </div>
    </aside>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
