<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loop, jour 02 | Devtober 2026</title>
  <meta name="description" content="Un générateur de fonds d'écran : des milliers de particules en boucle, en points, en ASCII ou en vecteurs.">
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0b0c;
      --panel: #111113;
      --raise: #19191c;
      --line: #26262a;
      --line-strong: #38383e;
      --text: #ededee;
      --muted: #a1a1a8;
      --faint: #85858c;
      --accent: #eb0a1e;
      --ease: cubic-bezier(.16, 1, .3, 1);
      --panel-w: 340px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg); color: var(--text);
      font-family: "Geist", system-ui, sans-serif; font-size: 14px;
      -webkit-font-smoothing: antialiased;
      display: grid; grid-template-rows: 56px 1fr; overflow: hidden;
    }
    .mono { font-family: "Geist Mono", ui-monospace, monospace; }
    button { font: inherit; color: inherit; }

    /* ---------- Barre du haut ---------- */
    .top { display: flex; align-items: center; gap: 16px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
    .back { color: var(--muted); text-decoration: none; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; transition: color .3s var(--ease); }
    .back:hover { color: var(--text); }
    .title { font-weight: 600; letter-spacing: -.01em; }
    .title span { color: var(--faint); font-weight: 400; margin-left: 6px; }
    .spacer { flex: 1; }
    .actions { display: flex; gap: 6px; align-items: center; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      height: 34px; padding: 0 12px;
      border: 1px solid var(--line-strong); border-radius: 999px;
      background: var(--raise); color: var(--text);
      font-size: 13px; font-weight: 500; white-space: nowrap; cursor: pointer;
      transition: border-color .3s var(--ease), background .3s var(--ease), transform .15s var(--ease);
    }
    .btn:hover { border-color: #55555c; }
    .btn:active { transform: scale(.97); }
    .btn:disabled { opacity: .5; cursor: progress; }
    .btn i { font-size: 16px; }
    .btn.icon { width: 34px; padding: 0; }
    .btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
    .btn.primary:hover { background: #fff; }
    .btn.wide { width: 100%; height: 38px; }

    /* ---------- Zone de travail ---------- */
    .work { display: grid; grid-template-columns: 1fr var(--panel-w); min-height: 0; transition: grid-template-columns .3s var(--ease); }
    body.panel-hidden .work { grid-template-columns: 1fr 0; }
    body.panel-hidden .panel { visibility: hidden; }

    .stage-wrap { display: grid; grid-template-rows: 1fr auto; min-width: 0; min-height: 0; }
    #stage {
      position: relative; display: grid; place-items: center; min-height: 0; overflow: hidden;
      background-image: radial-gradient(circle, #ffffff0c 1px, transparent 1.2px);
      background-size: 18px 18px;
    }
    #view, #draw { grid-area: 1 / 1; display: block; box-shadow: 0 0 0 1px var(--line), 0 30px 80px -30px #000; }
    #draw { position: relative; z-index: 1; box-shadow: none; pointer-events: none; cursor: crosshair; }
    #stage.drawing #draw { pointer-events: auto; }
    #stage.drawing #view { opacity: .35; }

    .stage-meta { position: absolute; top: 12px; left: 14px; right: 14px; display: flex; justify-content: space-between; font-size: 12px; color: var(--faint); pointer-events: none; }
    #draw-hint {
      position: absolute; top: 46px; left: 50%; transform: translateX(-50%);
      padding: 8px 14px; border-radius: 999px; background: var(--raise); border: 1px solid var(--line-strong);
      font-size: 13px; color: var(--text); pointer-events: none;
    }

    .bottom { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-top: 1px solid var(--line); background: var(--panel); overflow-x: auto; }
    .bottom .label { font-size: 12px; color: var(--faint); white-space: nowrap; }

    /* ---------- Panneau ---------- */
    .panel { border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; min-height: 0; overscroll-behavior: contain; }
    .panel-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
    .sec { padding: 16px; border-bottom: 1px solid var(--line); display: grid; gap: 14px; }
    .sec h2 { font-size: 13px; font-weight: 600; letter-spacing: .01em; }
    .ctl { display: grid; gap: 6px; }
    .ctl[hidden] { display: none; }
    .ctl-head { display: flex; justify-content: space-between; align-items: baseline; color: var(--muted); font-size: 13px; }
    .ctl-head output { font-family: "Geist Mono", monospace; font-size: 12px; color: var(--text); font-variant-numeric: tabular-nums; }

    input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; cursor: pointer; }
    input[type=range]::-webkit-slider-runnable-track { height: 3px; border-radius: 3px; background: linear-gradient(to right, var(--text) var(--p, 50%), var(--line-strong) var(--p, 50%)); }
    input[type=range]::-moz-range-track { height: 3px; background: var(--line-strong); border-radius: 3px; }
    input[type=range]::-moz-range-progress { height: 3px; background: var(--text); border-radius: 3px; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5.5px; border-radius: 50%; background: var(--text); border: 2px solid var(--panel); }
    input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--text); border: 2px solid var(--panel); }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      height: 30px; padding: 0 11px; border-radius: 999px;
      border: 1px solid var(--line-strong); background: transparent; color: var(--muted);
      font-size: 12.5px; cursor: pointer; white-space: nowrap;
      transition: border-color .25s var(--ease), color .25s var(--ease), background .25s var(--ease);
    }
    .chip:hover { color: var(--text); border-color: #55555c; }
    .chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }

    .swatches { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .sw {
      aspect-ratio: 1; border-radius: 50%; cursor: pointer;
      border: 2px solid transparent;
      background: radial-gradient(circle at 50% 50%, var(--c) 0 22%, var(--b) 23% 48%, var(--a) 49%);
      box-shadow: inset 0 0 0 1px #ffffff22;
      transition: transform .2s var(--ease);
    }
    .sw:hover { transform: scale(1.08); }
    .sw[aria-pressed="true"] { border-color: var(--text); }

    .color { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 13px; cursor: pointer; }
    .color input { width: 44px; height: 26px; border: 1px solid var(--line-strong); border-radius: 8px; background: none; padding: 2px; cursor: pointer; }
    .color input::-webkit-color-swatch-wrapper { padding: 0; }
    .color input::-webkit-color-swatch { border: 0; border-radius: 5px; }

    .toggle { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 13px; cursor: pointer; }
    .toggle input { position: absolute; opacity: 0; }
    .toggle i { width: 34px; height: 20px; border-radius: 999px; background: var(--line-strong); position: relative; transition: background .25s var(--ease); }
    .toggle i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--text); transition: transform .25s var(--ease); }
    .toggle input:checked + i { background: var(--text); }
    .toggle input:checked + i::after { transform: translateX(14px); background: var(--bg); }
    .toggle input:focus-visible + i { outline: 2px solid var(--accent); outline-offset: 2px; }

    .keys { padding: 16px; font-size: 12px; color: var(--faint); display: grid; gap: 6px; }
    kbd { font-family: "Geist Mono", monospace; font-size: 11px; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--line-strong); color: var(--muted); }

    #toast {
      position: fixed; left: 50%; bottom: 70px; transform: translate(-50%, 10px);
      padding: 10px 16px; border-radius: 999px; background: var(--text); color: var(--bg);
      font-size: 13px; font-weight: 500; opacity: 0; pointer-events: none;
      transition: opacity .3s var(--ease), transform .3s var(--ease);
    }
    #toast.on { opacity: 1; transform: translate(-50%, 0); }

    [hidden] { display: none !important; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ---------- Mobile : le panneau passe sous l'aperçu ---------- */
    @media (max-width: 820px) {
      body { grid-template-rows: 56px auto; overflow: auto; }
      .work { grid-template-columns: 1fr; }
      .stage-wrap { height: 62vh; }
      .panel { border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
      .title span, .actions .hide-sm { display: none; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <header class="top">
    <a class="back" href="../"><i class="ph ph-arrow-left"></i>Devtober</a>
    <span class="title">Loop<span>jour 02, générateur de fonds d'écran</span></span>
    <span class="spacer"></span>
    <div class="actions">
      <button class="btn" id="random" type="button"><i class="ph ph-shuffle"></i><span class="hide-sm">Aléatoire</span></button>
      <button class="btn icon" id="pause" type="button" aria-label="Pause"><i class="ph-fill ph-pause"></i></button>
      <button class="btn icon hide-sm" id="toggle-panel" type="button" aria-label="Afficher ou masquer les réglages"><i class="ph ph-sidebar-simple"></i></button>
      <button class="btn hide-sm" id="export-svg" type="button"><i class="ph ph-bezier-curve"></i>SVG</button>
      <button class="btn primary" id="export-png" type="button"><i class="ph ph-download-simple"></i><span>PNG</span></button>
    </div>
  </header>

  <div class="work">
    <div class="stage-wrap">
      <div id="stage">
        <canvas id="view" aria-label="Aperçu du fond d'écran"></canvas>
        <canvas id="draw" aria-label="Zone de dessin"></canvas>
        <div class="stage-meta mono"><span id="frame-size"></span><span id="perf"></span></div>
        <p id="draw-hint" hidden>Dessine une boucle d'un seul trait, relâche pour valider. <kbd>Échap</kbd> pour annuler.</p>
      </div>
      <div class="bottom">
        <span class="label">Format</span>
        <div class="chips" id="formats" style="flex-wrap: nowrap"></div>
      </div>
    </div>

    <aside class="panel" aria-label="Réglages">
      <div class="panel-actions">
        <button class="btn" id="share" type="button"><i class="ph ph-link"></i>Copier le lien</button>
        <button class="btn" id="reset" type="button"><i class="ph ph-arrow-counter-clockwise"></i>Par défaut</button>
      </div>
      <div id="controls"></div>
      <div class="keys">
        <span><kbd>Espace</kbd> pause</span>
        <span><kbd>R</kbd> combinaison aléatoire</span>
        <span><kbd>H</kbd> masquer les réglages</span>
      </div>
    </aside>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
